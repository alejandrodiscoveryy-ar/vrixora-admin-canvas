name: Verificar contacto y horarios TukTuk Lite (Admin)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/admin/MarketplaceLiteContactCard.tsx'
      - 'src/features/admin/MarketplaceSection.tsx'
      - 'supabase/migrations/20261030223000_marketplace_lite_contact_hours.sql'
      - 'tests/admin_lite_contact_hours.test.mjs'
      - '.github/workflows/lite-contact-admin-preflight.yml'
permissions:
  contents: read
jobs:
  lite-contact-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Validar contratos
        run: node --test tests/admin_lite_contact_hours.test.mjs
      - name: Dependencias
        run: bun install --frozen-lockfile
      - name: Build web de prueba (sin desplegar)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: bun run build
