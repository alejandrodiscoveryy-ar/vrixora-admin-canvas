name: Smart Pricing V3 - diagnostico de modalidades y horario
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/smart-pricing-v3-diagnostics.ts'
      - 'src/features/admin/MarketplacePricingV3Diagnostics.tsx'
      - 'src/features/admin/MarketplacePricingSection.tsx'
      - 'tests/smart_pricing_v3_diagnostics.test.mjs'
      - '.github/workflows/smart-pricing-v3-diagnostics-preflight.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Probar diagnostico sin escrituras
        run: node --experimental-strip-types --test tests/smart_pricing_v3_diagnostics.test.mjs
      - name: Preparar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Compilar Admin sin publicar
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: |
          bun install --frozen-lockfile
          bun run build
