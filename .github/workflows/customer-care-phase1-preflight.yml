name: Verificar Centro de Atencion (Fase 1)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/admin-navigation.ts'
      - 'src/features/admin/MarketplaceSection.tsx'
      - 'src/features/admin/MarketplaceCustomerCareWorkspace.tsx'
      - 'src/features/admin/MarketplaceTestRouteMap.tsx'
      - 'tests/admin_customer_care_phase1.test.mjs'
      - 'tests/admin_customer_care_phase2.test.mjs'
      - 'supabase/migrations/20261031002958_marketplace_care_phase2_verified_20261030.sql'
      - 'supabase/functions/marketplace-map-admin-gateway/index.ts'
      - '.github/workflows/customer-care-phase1-preflight.yml'
permissions:
  contents: read
jobs:
  admin-customer-care:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Contract tests
        run: node --test tests/admin_customer_care_phase1.test.mjs tests/admin_customer_care_phase2.test.mjs
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Build web without deploy
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: bun run build
