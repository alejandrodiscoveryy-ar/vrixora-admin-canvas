name: Customer 360 validation

on:
  push:
    branches:
      - feat/marketplace-customer-360
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Functional lint for Customer 360 files
        run: >
          bunx eslint
          src/features/admin/MarketplaceSection.tsx
          src/lib/services/demo.ts
          src/lib/services/index.ts
          src/lib/services/supabase.ts
          src/lib/services/types.ts
          --rule 'prettier/prettier: off'

      - name: Build
        run: bun run build