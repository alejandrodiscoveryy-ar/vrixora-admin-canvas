name: Verificar difusion de pruebas TUKTUK
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/admin/MarketplaceTestCenterV2.tsx'
      - 'supabase/migrations/20261105224500_tuktuk_broadcast_working_test_jobs.sql'
      - 'tests/marketplace_test_broadcast_preflight.test.mjs'
      - '.github/workflows/tuktuk-test-broadcast-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Verificar contrato del simulacro
        run: node --test tests/marketplace_test_broadcast_preflight.test.mjs
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Compilar Administracion sin publicar
        env:
          VITE_SUPABASE_URL: 'https://example.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.signature'
        run: bun run build
