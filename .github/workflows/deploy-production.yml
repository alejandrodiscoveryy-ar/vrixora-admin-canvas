name: Deploy Vrixora Admin

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmar publicación en producción"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vrixora-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == true }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_URL: https://admin.vrixora.com/
      WORKER_NAME: alejandrodiscoveryy-ar-vrixora-admin-canvas
      COMPATIBILITY_DATE: "2026-09-23"

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify approved commit is still main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$REMOTE_MAIN"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "APPROVED_COMMIT_STILL_MAIN=OK"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Verify required configuration exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${VITE_SUPABASE_URL:-}"
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "SUPABASE_PUBLISHABLE_KEY_INVALID"; exit 1 ;;
          esac

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Build and verify production bundle
        run: bun run build:production-safe

      - name: Prepare exact Cloudflare config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          const configPath = ".output/server/wrangler.json";
          if (!fs.existsSync(configPath)) {
            console.error("Generated Nitro wrangler.json not found.");
            process.exit(1);
          }

          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));

          if (!config.main && !(config.assets && config.assets.directory)) {
            console.error("Generated Wrangler config has no Worker entry point or assets directory.");
            process.exit(1);
          }

          config.name = process.env.WORKER_NAME;
          config.compatibility_date = process.env.COMPATIBILITY_DATE;
          config.compatibility_flags = ["nodejs_compat"];
          // Production routing is managed in Cloudflare, not by this workflow.
          // Disable workers.dev so a least-privilege Worker token can deploy
          // without account-level subdomain permissions.
          config.workers_dev = false;

          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");

          console.log(`CONFIG_SOURCE=${configPath}`);
          console.log(`CONFIG_MAIN=${config.main ?? "NONE"}`);
          console.log(`CONFIG_ASSETS=${config.assets?.directory ?? "NONE"}`);
          console.log(`WORKER_NAME=${config.name}`);
          console.log(`COMPATIBILITY_DATE=${config.compatibility_date}`);
          NODE

      - name: Calculate integrity marker hash
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$(grep -RIl --include='*.js' --include='*.mjs' 'Mapa operativo' .output/public | head -n 1)"
          test -n "$ASSET"
          REL="${ASSET#.output/public/}"
          LOCAL_HASH="$(sha256sum "$ASSET" | awk '{print toupper($1)}')"
          echo "MAP_ASSET=$REL" >> "$GITHUB_ENV"
          echo "LOCAL_HASH=$LOCAL_HASH" >> "$GITHUB_ENV"
          echo "MAP_ASSET=$REL"
          echo "LOCAL_SHA256=$LOCAL_HASH"

      - name: Deploy exact build to existing Admin Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.115.0 deploy \
            --config .output/server/wrangler.json \
            --keep-vars

      - name: Verify production asset hash
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Cache-Control: no-cache" "${PUBLIC_URL}?release=${GITHUB_SHA}" >/dev/null
          REMOTE="$RUNNER_TEMP/vrixora-admin-asset.js"
          curl -fsSL -H "Cache-Control: no-cache" "${PUBLIC_URL}${MAP_ASSET}?release=${GITHUB_SHA}" -o "$REMOTE"
          REMOTE_HASH="$(sha256sum "$REMOTE" | awk '{print toupper($1)}')"
          echo "REMOTE_SHA256=$REMOTE_HASH"
          test "$REMOTE_HASH" = "$LOCAL_HASH"
          grep -q "Mapa operativo" "$REMOTE"
          echo "PRODUCTION_INTEGRITY=OK"