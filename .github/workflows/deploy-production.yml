# PROCEDIMIENTO OBSOLETO: sin capacidad de publicar en produccion.
# Publicacion vigente de Vrixora Admin: Cloudflare Workers Builds,
# activada automaticamente por cambios integrados en main.
# Esta ruta manual se deshabilito para impedir despliegues duplicados
# y errores de acceso al Worker. El historial Git conserva el original.
name: "INACTIVO - despliegue manual de Vrixora Admin"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aviso:
    name: "No publica: Cloudflare Workers Builds gestiona Admin"
    runs-on: ubuntu-24.04
    steps:
      - name: Informar que el procedimiento manual esta inhabilitado
        run: |
          echo "::notice title=Despliegue manual inhabilitado::Vrixora Admin se publica automaticamente mediante Cloudflare Workers Builds al integrar en main."
          echo "LEGACY_MANUAL_DEPLOY=DISABLED"
