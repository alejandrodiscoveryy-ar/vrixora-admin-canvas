name: "TukTuk · ranking de conductores constantes"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/admin/MarketplaceOperationalMap.tsx"
      - "src/features/admin/MarketplaceDriverConsistencyPanel.tsx"
      - "supabase/migrations/20261116222332_marketplace_driver_consistency_readonly.sql"
      - "supabase/verification/marketplace_driver_consistency_fixture.sql"
      - "tests/marketplace_driver_consistency.test.mjs"
      - "tests/admin_map_driver_avatar_contract.test.mjs"
      - "supabase/functions/marketplace-map-admin-gateway/index.ts"
      - ".github/workflows/marketplace-driver-consistency.yml"

permissions:
  contents: read

jobs:
  backend:
    name: "Ranking historico y permisos: PostgreSQL aislado"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Ejecutar migracion real contra datos ficticios solamente
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            postgres:17 sh -c 'psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /repo/supabase/verification/marketplace_driver_consistency_fixture.sql'

  frontend:
    name: "Contrato visual y build Admin sin publicar"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node + Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Testear contrato de ranking
        run: node --test tests/marketplace_driver_consistency.test.mjs tests/admin_map_driver_avatar_contract.test.mjs
      - name: Instalar dependencias existentes
        run: bun install --frozen-lockfile
      - name: Compilar sin desplegar
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.signature"
        run: bun run build
