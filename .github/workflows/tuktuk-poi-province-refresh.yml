name: TUKTUK · Actualizar catalogo de provincias

on:
  schedule:
    - cron: '17 6 * * *'  # respaldo diario: el botón usa workflow_dispatch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuktuk-poi-province-import
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Comprobar secretos de importacion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo 'FALTA_SUPABASE_URL'; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'FALTA_SUPABASE_SERVICE_ROLE_KEY'; exit 1; }
      - name: Instalar bibliotecas versionadas
        run: python -m pip install --disable-pip-version-check -r scripts/territory/requirements.txt
      - name: Procesar una solicitud validada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/territory/refresh_province.py
