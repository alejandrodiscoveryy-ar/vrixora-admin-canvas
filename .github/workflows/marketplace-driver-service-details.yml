name: Verificar detalles de servicios para conductor
on:
  pull_request:
    paths:
      - 'supabase/proposals/marketplace_driver_service_details.sql'
      - 'supabase/migrations/*_marketplace_driver_service_details.sql'
      - 'supabase/verification/marketplace_driver_service_details_fixture.sql'
      - '.github/workflows/marketplace-driver-service-details.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driver_details_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d driver_details_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.8
      - name: Generate and compare migration
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'supabase/migrations/*_marketplace_driver_service_details.sql')
          if ($files.Count -eq 0) {
            supabase migration new --help
            if ($LASTEXITCODE -ne 0) { throw "CLI unavailable" }
            supabase migration new marketplace_driver_service_details
            if ($LASTEXITCODE -ne 0) { throw "Migration generation failed" }
            $files = @(Get-ChildItem 'supabase/migrations/*_marketplace_driver_service_details.sql')
            Copy-Item 'supabase/proposals/marketplace_driver_service_details.sql' $files[0].FullName -Force
          }
          if ($files.Count -ne 1) { throw "Expected one migration" }
          if ((Get-FileHash $files[0].FullName).Hash -ne (Get-FileHash 'supabase/proposals/marketplace_driver_service_details.sql').Hash) { throw "SQL mismatch" }
          Write-Output "DRIVER_DETAILS_MIGRATION_FILE=$($files[0].Name)"
      - name: Verify isolated PostgreSQL permissions and payload
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work:ro" -w /work postgres:17 \
            psql -h 127.0.0.1 -U postgres -d driver_details_fixture -v ON_ERROR_STOP=1 -f supabase/verification/marketplace_driver_service_details_fixture.sql
