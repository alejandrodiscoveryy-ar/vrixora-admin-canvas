name: Admin - comprobar retiro seguro de modulos demo

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/demo-auth.tsx'
      - 'src/lib/demo-store.ts'
      - 'tests/admin_demo_modules_retirement.test.mjs'
      - '.github/workflows/admin-demo-retirement-preflight.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Comprobar referencias y compilar web sin publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Verificar retirada y ausencia de consumidores
        run: node --test tests/admin_demo_modules_retirement.test.mjs
      - name: Instalar dependencias bloqueadas
        run: bun install --frozen-lockfile
      - name: Compilar Admin de ensayo, sin desplegar
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: bun run build
