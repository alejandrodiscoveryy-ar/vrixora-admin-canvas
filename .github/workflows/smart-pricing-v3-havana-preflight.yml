name: Smart Pricing V3 - hora oficial de Cuba
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/havana-official-time.ts'
      - 'src/features/admin/MarketplacePricingLaboratoryV2.tsx'
      - 'tests/smart_pricing_havana_time.test.mjs'
      - 'supabase/migrations/*_tuktuk_havana_official_time_v3.sql'
      - 'supabase/verification/tuktuk_havana_time_v3_static.py'
      - '.github/workflows/smart-pricing-v3-havana-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test UTC-4 de Cuba
        run: node --experimental-strip-types --test tests/smart_pricing_havana_time.test.mjs
      - name: Validar parche SQL sin ejecutarlo
        run: python3 supabase/verification/tuktuk_havana_time_v3_static.py
      - name: Preparar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Compilar Admin sin modificar produccion
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: |
          bun install --frozen-lockfile
          bun run build
