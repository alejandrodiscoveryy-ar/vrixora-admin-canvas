name: Verificar mensajes WhatsApp de servicios
on:
  pull_request:
    paths:
      - 'src/lib/marketplace-service-share.ts'
      - 'src/features/admin/MarketplaceServiceShareButton.tsx'
      - 'supabase/proposals/marketplace_admin_whatsapp_payload.sql'
      - 'supabase/migrations/*_marketplace_admin_whatsapp_payload.sql'
      - 'supabase/verification/marketplace_admin_whatsapp_share_fixture.sql'
      - 'tests/marketplace_admin_whatsapp_share.test.mjs'
      - 'tests/admin_mobile_job_share_flow.test.mjs'
      - 'scripts/New-MarketplaceWhatsappMigration.ps1'
      - '.github/workflows/marketplace-admin-whatsapp-share.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Message unit tests
        run: node --test tests/marketplace_admin_whatsapp_share.test.mjs tests/admin_mobile_job_share_flow.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.8
      - name: Verify migration generated by CLI
        shell: pwsh
        run: |
          $migration = @(Get-ChildItem 'supabase/migrations/*_marketplace_admin_whatsapp_payload.sql')
          if ($migration.Count -eq 0) {
            ./scripts/New-MarketplaceWhatsappMigration.ps1
            $migration = @(Get-ChildItem 'supabase/migrations/*_marketplace_admin_whatsapp_payload.sql')
          }
          if ($migration.Count -ne 1) { throw "Expected exactly one migration" }
          $proposal = Get-FileHash 'supabase/proposals/marketplace_admin_whatsapp_payload.sql'
          if ((Get-FileHash $migration[0].FullName).Hash -ne $proposal.Hash) { throw "Migration differs from reviewed SQL" }
          Write-Output "WHATSAPP_MIGRATION_FILE=$($migration[0].Name)"
      - name: PostgreSQL isolated authorization and availability fixture
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work:ro" -w /work postgres:17 \
            psql -h 127.0.0.1 -U postgres -d whatsapp_fixture -v ON_ERROR_STOP=1 -f supabase/verification/marketplace_admin_whatsapp_share_fixture.sql
