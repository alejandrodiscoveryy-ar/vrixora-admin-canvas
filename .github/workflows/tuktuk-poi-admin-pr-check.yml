name: Verificar TUKTUK Mapas y Provincias
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/admin/MarketplaceSection.tsx'
      - 'src/features/admin/MarketplaceConfigurationWorkspace.tsx'
      - 'src/lib/services/types.ts'
      - 'src/features/admin/MarketplaceTerritoryCatalog.tsx'
      - 'supabase/functions/marketplace-poi-admin-gateway/index.ts'
      - 'supabase/migrations/20261031193538_marketplace_territorial_poi_control.sql'
      - 'scripts/territory/**'
      - '.github/workflows/tuktuk-poi-*.yml'
      - 'tests/marketplace_territorial_poi.test.mjs'
      - 'tests/marketplace_config_territory_premium.test.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Sintaxis Python
        run: python -m py_compile scripts/territory/refresh_province.py
      - name: Pruebas geograficas
        run: python tests/test_territory_geometry.py
      - name: Pruebas de contratos
        run: node --test tests/marketplace_territorial_poi.test.mjs tests/marketplace_config_territory_premium.test.mjs
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Dependencias y compilación Admin
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: |
          bun install --frozen-lockfile
          bun run build
