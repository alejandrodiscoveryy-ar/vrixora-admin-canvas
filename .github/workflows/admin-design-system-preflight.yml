name: Admin - verificacion del sistema de diseno

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'public/sw.js'
      - 'tests/admin_windows_delivery_regression.test.mjs'
      - 'tests/admin_pwa_cache_refresh.test.mjs'
      - 'src/features/admin/**'
      - 'src/lib/agency-vitality.ts'
      - 'docs/security/agency-vitality-v1-candidate.sql'
      - 'tests/admin_agency_vitality.test.mjs'
      - 'src/lib/admin-project-entry.ts'
      - 'src/routes/admin.proyectos.index.tsx'
      - 'src/routes/admin.proyectos.$id.tsx'
      - 'tests/admin_single_project_start.test.mjs'
      - 'tests/admin_sidebar_collapse.test.mjs'
      - 'tests/admin_settings_primary_submenu.test.mjs'
      - 'tests/admin_app_versions_nav_clarity.test.mjs'
      - 'tests/admin_config_mobile_density.test.mjs'
      - 'tests/admin_config_premium_integral_contract.test.mjs'
      - 'tests/admin_config_premium_five_sections.test.mjs'
      - 'supabase/migrations/20261119013500_marketplace_ally_branded_shortlinks_v1.sql'
      - 'supabase/functions/marketplace-ally-shortlink/**'
      - 'tests/tuktuk_allies_contract.test.mjs'
      - 'tests/tuktuk_allies_funnel_v2_contract.test.mjs'
      - 'supabase/migrations/20261120191500_marketplace_ally_funnel_reasons_v2.sql'
      - 'supabase/functions/marketplace-impulsa-analytics/index.ts'
      - 'src/routes/admin*.tsx'
      - 'src/routes/__root.tsx'
      - 'src/styles.css'
      - 'src/lib/admin-navigation.ts'
      - 'src/lib/utils.ts'
      - 'tests/admin_design_system.test.mjs'
      - 'tests/admin_topup_reversal.test.mjs'
      - 'tests/admin_pulso_decisiones.test.mjs'
      - 'tests/comercial_integral_ui_contract.test.mjs'
      - 'tests/comercial_graphite_softness_contract.test.mjs'
      - 'tests/comercial_captacion_experiencia_contract.test.mjs'
      - 'tests/comercial_source_overview.test.mjs'
      - 'tests/comercial_politicas_premium_contract.test.mjs'
      - 'tests/driver_promotion_preview.test.mjs'
      - 'tests/marketplace_promo_alias_suggestions.test.mjs'
      - 'src/lib/marketplace-promo-alias.ts'
      - 'scripts/verify-production-build.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/admin-design-system-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Probar componentes y compilar Admin (sin publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Instalar dependencias bloqueadas
        run: bun install --frozen-lockfile
      - name: Probar el contrato de componentes premium
        run: bun test tests/admin_design_system.test.mjs
      - name: Probar anulacion segura de recargas confirmadas
        run: node --test tests/admin_topup_reversal.test.mjs
      - name: Validar tablero de decisiones operativas de Pulso
        run: node --test tests/admin_pulso_decisiones.test.mjs
      - name: Verificar vitalidad real y reglas semafóricas de TukTuk
        run: bun test tests/admin_agency_vitality.test.mjs
      - name: Validar arquitectura integral de Comercial
        run: node --test tests/comercial_integral_ui_contract.test.mjs
      - name: Comprobar grafito suave de Comercial
        run: node --test tests/comercial_graphite_softness_contract.test.mjs
      - name: Comprobar Captación sin duplicaciones ni ceros ficticios
        run: node --test tests/comercial_captacion_experiencia_contract.test.mjs
      - name: Comprobar separación de canales y tráfico orgánico
        run: node --test tests/comercial_source_overview.test.mjs
      - name: Validar experiencia premium y seguridad financiera en Gestión
        run: node --test tests/comercial_politicas_premium_contract.test.mjs
      - name: Verificar validación y autorización de Impulsa en conductor 360
        run: node --test tests/driver_promotion_preview.test.mjs
      - name: Verificar propuesta única de nombre de Impulsa
        run: bun test tests/marketplace_promo_alias_suggestions.test.mjs
      - name: Verificar entrada automática al proyecto único
        run: bun test tests/admin_single_project_start.test.mjs
      - name: Verificar logos y controles del menú lateral
        run: bun test tests/admin_sidebar_collapse.test.mjs
      - name: Verificar apertura y cierre de submenús de Configuración
        run: bun test tests/admin_settings_primary_submenu.test.mjs
      - name: Garantizar pantallas visibles y acceso rápido a APK
        run: bun test tests/admin_app_versions_nav_clarity.test.mjs
      - name: Validar densidad móvil real de Configuración y marca
        run: bun test tests/admin_config_mobile_density.test.mjs
      - name: Validar experiencia premium integral de Configuración
        run: bun test tests/admin_config_premium_integral_contract.test.mjs tests/admin_config_premium_five_sections.test.mjs
      - name: Verificar nicks de Aliados y privacidad
        run: node --test tests/tuktuk_allies_contract.test.mjs
      - name: Validar medición anónima y embudo comercial de Aliados
        run: node --test tests/tuktuk_allies_funnel_v2_contract.test.mjs
      - name: Validar actualizaciones PWA y alertas push
        run: node --test tests/admin_windows_delivery_regression.test.mjs tests/admin_pwa_cache_refresh.test.mjs tests/marketplace_impulsa_self_service.test.mjs
      - name: Compilar y verificar bundle de prueba (sin desplegar)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: bun run build:production-safe
