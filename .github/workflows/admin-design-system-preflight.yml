name: Admin - verificacion del sistema de diseno

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/features/admin/**'
      - 'src/routes/admin*.tsx'
      - 'src/routes/__root.tsx'
      - 'src/styles.css'
      - 'src/lib/admin-navigation.ts'
      - 'src/lib/utils.ts'
      - 'tests/admin_design_system.test.mjs'
      - 'scripts/verify-production-build.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/admin-design-system-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Probar componentes y compilar Admin (sin publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Instalar dependencias bloqueadas
        run: bun install --frozen-lockfile
      - name: Probar el contrato de componentes premium
        run: bun test tests/admin_design_system.test.mjs
      - name: Compilar y verificar bundle de prueba (sin desplegar)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: bun run build:production-safe
