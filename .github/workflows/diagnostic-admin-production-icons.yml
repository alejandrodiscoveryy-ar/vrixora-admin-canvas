name: Comprobar nueva version publica de Admin
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: ['.github/workflows/diagnostic-admin-production-icons.yml']
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verificar version exacta y Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          SHA=d2c02df9a8db331ee9486b1afd641d94358eb4d6
          for attempt in 1 2 3 4; do
            echo "ATTEMPT=$attempt"
            gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | {name,app:.app.slug,status,conclusion,details_url}' || true
            code=$(curl -sS -L --max-time 12 -o /tmp/release -w '%{http_code}' "https://admin.vrixora.com/tuktuk-admin-release.json?release=$SHA-$attempt") || code=FETCH_FAILED
            echo "PUBLIC_RELEASE_HTTP=$code"
            if [ "$code" = 200 ] && jq -e '.release=="tuktuk-modality-icons-v1" and .feature_commit=="8335397ee7b55025bdaf6720e794f5db6761a5b9"' /tmp/release >/dev/null 2>&1; then
              echo 'PUBLIC_RELEASE_VERIFIED'
              exit 0
            fi
            if [ "$attempt" != 4 ]; then sleep 8; fi
          done
          echo 'PUBLIC_RELEASE_NOT_VERIFIED'
