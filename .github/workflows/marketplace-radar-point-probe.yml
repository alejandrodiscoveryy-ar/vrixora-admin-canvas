name: Verificar prueba de radar por punto
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/admin/MarketplaceRadarPointProbe.tsx'
      - 'src/features/admin/MarketplaceTestRadarToggle.tsx'
      - 'src/features/admin/MarketplaceDispatchSettingsCard.tsx'
      - 'src/features/admin/MarketplaceTestCenterV2.tsx'
      - 'src/features/admin/MarketplaceTestRouteMap.tsx'
      - 'src/features/admin/MarketplaceConfigurationWorkspace.tsx'
      - 'supabase/migrations/20261124153500_marketplace_radar_point_probe_v1.sql'
      - 'tests/marketplace_radar_point_probe.test.mjs'
      - '.github/workflows/marketplace-radar-point-probe.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Comprobar contrato de seguridad y radar
        run: node --test tests/marketplace_radar_point_probe.test.mjs
      - name: Preparar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Compilar Vrixora con la prueba integrada
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
        run: |
          bun install --frozen-lockfile
          bun run build
