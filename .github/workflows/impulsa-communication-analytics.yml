name: "TukTuk · Impulsa Analytics comunicación (sin producción)"
on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/admin/MarketplaceImpulsaCommunicationAnalytics.tsx"
      - "src/features/admin/ComercialSection.tsx"
      - "supabase/migrations/20261116230000_impulsa_communication_analytics.sql"
      - "supabase/verification/impulsa_communication_analytics_fixture.sql"
      - "supabase/functions/marketplace-impulsa-analytics/**"
      - "supabase/config.toml"
      - "tests/impulsa_communication_contract.test.mjs"
      - "tests/tuktuk_official_communication_contract.test.mjs"
      - "src/features/admin/MarketplaceTuktukOfficialAnalytics.tsx"
      - "supabase/migrations/20261117090000_tuktuk_official_communication_campaign.sql"
      - "supabase/verification/tuktuk_official_communication_fixture.sql"
      - ".github/workflows/impulsa-communication-analytics.yml"
permissions:
  contents: read
jobs:
  postgres:
    name: "Base de datos ficticia · eventos, privacidad y permisos"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verificar SQL real sobre datos de laboratorio
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "$GITHUB_WORKSPACE:/repo:ro" postgres:17 sh -c \
            'psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /repo/supabase/verification/impulsa_communication_analytics_fixture.sql'
      - name: Verificar la campaña oficial en base ficticia separada
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "$GITHUB_WORKSPACE:/repo:ro" postgres:17 sh -c \
            'psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE tuktuk_official_fixture" && psql -h localhost -U postgres -d tuktuk_official_fixture -v ON_ERROR_STOP=1 -f /repo/supabase/verification/tuktuk_official_communication_fixture.sql'
  admin:
    name: "Dashboard, contratos y compilación Admin sin publicar"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: node --test tests/impulsa_communication_contract.test.mjs
      - run: node --test tests/tuktuk_official_communication_contract.test.mjs
      - run: bun install --frozen-lockfile
      - name: Compilar exclusivamente
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.signature"
        run: bun run build
