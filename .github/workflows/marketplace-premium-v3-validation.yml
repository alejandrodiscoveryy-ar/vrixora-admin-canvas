name: Marketplace premium v3 validation

on:
  push:
    branches:
      - feat/marketplace-premium-v3-operational-map
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Functional lint
        run: >
          bunx eslint
          src/features/admin/MarketplaceSection.tsx
          src/features/admin/MarketplaceOperationalMap.tsx
          src/lib/marketplace-map.ts
          --rule 'prettier/prettier: off'

      - name: Build
        run: bun run build